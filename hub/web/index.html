<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Home</title>
</head>
<body>
  <header class="top">
    <h1 id="title">Home</h1>
    <span id="sync" class="sync" aria-live="polite"></span>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="rooms" class="active">Rooms</button>
    <button data-tab="scenes">Scenes</button>
    <button data-tab="schedules">Schedules</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
